[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/IZ737/kiln"
rust-version = "1.97"

[workspace.dependencies]
kiln_diagnostics = { path = "crates/kiln_diagnostics" }
kiln_syntax = { path = "crates/kiln_syntax" }
kiln_check = { path = "crates/kiln_check" }
kiln_ir = { path = "crates/kiln_ir" }
kiln_css = { path = "crates/kiln_css" }
kiln_codegen = { path = "crates/kiln_codegen" }
kiln_native = { path = "crates/kiln_native" }
kiln_wasm = { path = "crates/kiln_wasm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The runtime library linked into every Kiln program (`crates/kiln_rt`).
# Fat LTO keeps only what its exported functions reach, so the library that
# `kiln` carries holds the parts of Rust's standard library it uses, not
# all of it.
[profile.runtime]
inherits = "release"
panic = "abort"
lto = "fat"
codegen-units = 1
