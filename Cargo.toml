[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/IZ737/kiln"
rust-version = "1.82"

[workspace.dependencies]
kiln_diagnostics = { path = "crates/kiln_diagnostics" }
kiln_syntax = { path = "crates/kiln_syntax" }
kiln_check = { path = "crates/kiln_check" }
kiln_ir = { path = "crates/kiln_ir" }
kiln_codegen = { path = "crates/kiln_codegen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
