name: Release

# Pushing a tag such as `v0.2.0` builds the standalone kiln for Linux and
# Windows (x86-64), checks each with the conformance programs on a system
# with nothing else installed, and publishes them as a GitHub release, with
# the VS Code extension. Each kiln can build executables for both systems.
# Set the version in Cargo.toml and editors/vscode/package.json to the
# tag's first: the build stops if they differ.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-mingw-w64-x86-64
      - run: cargo build --release --target x86_64-unknown-linux-musl -p kiln_cli
      - run: strip target/x86_64-unknown-linux-musl/release/kiln
      - name: The tag matches the version kiln reports
        run: |
          reported=$(target/x86_64-unknown-linux-musl/release/kiln --version)
          if [ "$reported" != "kiln ${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but kiln --version says '$reported': set version in Cargo.toml"
            exit 1
          fi
      - run: scripts/clean-check.sh target/x86_64-unknown-linux-musl/release/kiln
      - name: Package
        run: |
          name="kiln-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir "$name"
          cp target/x86_64-unknown-linux-musl/release/kiln LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: kiln-*-x86_64-linux.tar.gz*

  windows-x86_64-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-mingw-w64-x86-64
      - run: cargo build --release --target x86_64-pc-windows-gnu -p kiln_cli
      - run: x86_64-w64-mingw32-strip target/x86_64-pc-windows-gnu/release/kiln.exe
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-exe
          path: target/x86_64-pc-windows-gnu/release/kiln.exe

  windows-x86_64:
    needs: windows-x86_64-build
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kiln-exe
      - name: Check
        shell: bash
        run: PATH=/usr/bin scripts/windows-check.sh kiln.exe
      - name: Package
        shell: bash
        run: |
          name="kiln-${GITHUB_REF_NAME}-x86_64-windows"
          mkdir "$name"
          cp kiln.exe LICENSE README.md "$name/"
          7z a "$name.zip" "$name" > /dev/null
          sha256sum "$name.zip" > "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: kiln-*-x86_64-windows.zip*

  # The VS Code extension, as a .vsix to install with
  # `code --install-extension`.
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag matches the extension's version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but editors/vscode/package.json says $version"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npx vsce package -o "kiln-vscode-${GITHUB_REF_NAME}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: editors/vscode/kiln-vscode-*.vsix

  publish:
    needs: [linux-x86_64, windows-x86_64, vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # dist also holds the bare kiln.exe the Windows check used, which is
        # already in the zip.
        run: |
          rm -f dist/kiln.exe
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
