name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # libgc-dev is for the C backend; musl-tools builds the runtime that the
      # native backend links into executables.
      - run: sudo apt-get update && sudo apt-get install -y libgc-dev musl-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run -p kiln_cli -- check examples
      - run: cargo run -p kiln_cli -- run examples/hello
      - name: Native builds need no tools, and their executables no libraries
        run: |
          mkdir -p /tmp/empty-root
          # A PATH with nothing in it, so no C compiler or linker can be found.
          env -i PATH=/nonexistent ./target/debug/kiln build examples/hello -o /tmp/empty-root/hello
          # A root with nothing in it but the executable: no libc, no /proc.
          sudo chroot /tmp/empty-root /hello

  # The kiln that releases ship: built against musl, so it is static and
  # runs on any Linux x86-64 system, then checked in an empty container.
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl -p kiln_cli
      - run: scripts/clean-check.sh target/x86_64-unknown-linux-musl/release/kiln
