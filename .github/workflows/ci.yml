name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Database servers for the `sql` module's clients, `kiln db` and the
    # journal example (KILN_POSTGRES_URL and KILN_MYSQL_URL below).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kiln
          POSTGRES_PASSWORD: kiln
          POSTGRES_DB: kiln
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kiln" --health-interval 2s
          --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kiln
          MYSQL_USER: kiln
          MYSQL_PASSWORD: kiln
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 2s
          --health-timeout 5s --health-retries 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # The runtime's Rust part is built for each target kiln makes
          # programs for.
          targets: x86_64-unknown-linux-musl, x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      # libgc-dev is for the C backend; musl-tools and mingw-w64 build the
      # runtimes that the native backend makes Linux and Windows executables
      # from.
      # A stuck package mirror fails the step instead of hanging.
      - run: sh scripts/install-ci-deps.sh libgc-dev musl-tools gcc-mingw-w64-x86-64
        timeout-minutes: 10
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Node.js runs the WebAssembly builds of the conformance programs, and
      # Playwright's Chromium the tests in a real browser (tests/browser.rs).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Playwright and Chromium, for the browser tests
        run: |
          npm install --prefix /tmp/playwright playwright@1.63.0
          /tmp/playwright/node_modules/.bin/playwright install --with-deps chromium
          echo "NODE_PATH=/tmp/playwright/node_modules" >> "$GITHUB_ENV"
        timeout-minutes: 10
      - run: cargo test
        env:
          KILN_BROWSER: 1
          KILN_POSTGRES_URL: postgres://kiln:kiln@127.0.0.1:5432/kiln
          KILN_MYSQL_URL: mysql://kiln:kiln@127.0.0.1:3306/kiln
      - run: cargo run -p kiln_cli -- check examples
      - name: kiln lsp answers an editor, and the VS Code extension works in VS Code
        working-directory: editors/vscode
        run: |
          npm ci
          node test/lsp-smoke.js ../../target/debug/kiln
          KILN_PATH=../../target/debug/kiln xvfb-run -a npm run test:integration
      - run: cargo run -p kiln_cli -- run examples/hello
      - name: Native builds need no tools, and their executables no libraries
        run: |
          mkdir -p /tmp/empty-root
          # A PATH with nothing in it, so no C compiler or linker can be found.
          env -i PATH=/nonexistent ./target/debug/kiln build examples/hello -o /tmp/empty-root/hello
          env -i PATH=/nonexistent ./target/debug/kiln build examples/hello --target windows -o /tmp/hello.exe
          # A root with nothing in it but the executable: no libc, no /proc.
          sudo chroot /tmp/empty-root /hello
      - name: kiln upgrade installs a real release over itself
        run: |
          mkdir -p /tmp/upgrade && cp target/debug/kiln /tmp/upgrade/kiln
          /tmp/upgrade/kiln upgrade --version v0.3.0 --force
          curl -fsSL https://github.com/IZ737/kiln/releases/download/v0.3.0/kiln-v0.3.0-x86_64-linux.tar.gz | tar xz -C /tmp
          cmp /tmp/upgrade/kiln /tmp/kiln-v0.3.0-x86_64-linux/kiln

  # Known vulnerabilities and licences of the libraries kiln and its runtime
  # use (deny.toml).
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The VS Code extension's grammars and manifest.
  vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx vsce package
      - uses: actions/upload-artifact@v7
        with:
          name: kiln-vscode
          path: editors/vscode/*.vsix

  # The kiln that releases ship: built against musl, so it is static and
  # runs on any Linux x86-64 system, then checked in an empty container.
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # kiln carries the runtime's Rust part built for both.
          targets: x86_64-unknown-linux-musl, x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      # A stuck package mirror fails the step instead of hanging.
      - run: sh scripts/install-ci-deps.sh musl-tools gcc-mingw-w64-x86-64
        timeout-minutes: 10
      - run: cargo build --release --target x86_64-unknown-linux-musl -p kiln_cli
      - run: scripts/clean-check.sh target/x86_64-unknown-linux-musl/release/kiln

  # kiln.exe, cross-compiled here and checked on Windows by the next job.
  windows-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # kiln carries the runtime's Rust part built for both.
          targets: x86_64-unknown-linux-musl, x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      # A stuck package mirror fails the step instead of hanging.
      - run: sh scripts/install-ci-deps.sh musl-tools gcc-mingw-w64-x86-64
        timeout-minutes: 10
      - run: cargo build --release --target x86_64-pc-windows-gnu -p kiln_cli
      - uses: actions/upload-artifact@v7
        with:
          name: kiln-windows
          path: target/x86_64-pc-windows-gnu/release/kiln.exe

  windows:
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The expected output files must keep their `\n` line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kiln-windows
      - name: kiln lsp answers an editor with Windows paths
        run: node editors/vscode/test/lsp-smoke.js kiln.exe
      - name: Conformance programs with kiln.exe and no other tools
        shell: bash
        # Only Git's own tools (bash, diff) on the PATH: no C compiler.
        run: PATH=/usr/bin scripts/windows-check.sh kiln.exe
      # Windows cannot overwrite a running executable, so kiln.exe moves
      # itself aside first.
      - name: kiln upgrade replaces the running kiln.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory upgrade | Out-Null
          Copy-Item kiln.exe upgrade\kiln.exe
          upgrade\kiln.exe upgrade --version v0.3.0 --force
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Invoke-WebRequest -UseBasicParsing https://github.com/IZ737/kiln/releases/download/v0.3.0/kiln-v0.3.0-x86_64-windows.zip -OutFile release.zip
          Expand-Archive release.zip release
          $installed = (Get-FileHash upgrade\kiln.exe).Hash
          $released = (Get-FileHash release\kiln-v0.3.0-x86_64-windows\kiln.exe).Hash
          if ($installed -ne $released) { throw "kiln.exe was not replaced" }
