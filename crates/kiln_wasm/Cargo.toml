[package]
name = "kiln_wasm"
description = "The WebAssembly (WasmGC) backend of the Kiln compiler, for embers in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kiln_diagnostics.workspace = true
kiln_check.workspace = true
kiln_ir.workspace = true
serde_json.workspace = true
# The module is written as WebAssembly text and assembled by the Bytecode
# Alliance's assembler, then checked by its validator, so a mistake in the
# backend is an error at build time rather than in a browser.
wat = "1"
wasmparser = "0.262"

[dev-dependencies]
kiln_syntax.workspace = true
