[package]
name = "kiln_cli"
description = "The `kiln` command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "kiln"
path = "src/main.rs"

[dependencies]
toml = "0.8"
kiln_diagnostics.workspace = true
kiln_syntax.workspace = true
kiln_check.workspace = true
kiln_ir.workspace = true
kiln_css.workspace = true
kiln_codegen.workspace = true
kiln_native.workspace = true
kiln_wasm.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
# For `kiln upgrade`: HTTPS with rustls (ring, so no cmake), the system's
# certificates, checksums and the release archives.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
rustls-native-certs = "0.8"
webpki-root-certs = "1"
sha2 = "0.11"
# Ware versions and requirements.
semver = "1"
# `kiln db`: reading and migrating a SQLite database, with SQLite
# compiled in, as the runtime has it.
rusqlite = { version = "0.41", features = ["bundled"] }
# `kiln db` on PostgreSQL and MySQL.
kiln_dbwire = { path = "../kiln_dbwire" }
serde = { workspace = true }
base64 = "0.22"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
