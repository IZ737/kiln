[package]
name = "kiln_rt"
description = "The part of the Kiln runtime written in Rust, linked into every Kiln program"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# `kiln_native` and `kiln_codegen` build this as a static library for each
# target they make programs for, with the `runtime` profile (see the
# workspace's Cargo.toml), and carry the result. See `staticlib.rs`.
[lib]
crate-type = ["staticlib"]
doctest = false

[dependencies]
# The `base64` module, and files carried inside programs.
base64 = "0.23"
# The `web` server: hyper's HTTP/1 server, without tokio (see
# `src/server.rs`), and request data on the crates the url crate uses.
bytes = "1"
cookie = "0.18"
form_urlencoded = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["http1", "server"] }
percent-encoding = "2"
serde = "1"
# The `markdown` module.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Escaping values in rendered glazes (`src/html.rs`).
html-escape = "0.3"
# `float_roundtrip` reads every float exactly, as `strtod` does.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The `sql` module: SQLite, compiled into every program that opens a
# database, so it needs no library on the system.
rusqlite = { version = "0.41", features = ["bundled"] }
# `auth`: Argon2id password hashes, session ids the system's random
# numbers make, and their SHA-256 digests.
argon2 = "0.6"
getrandom = { version = "0.4", features = ["std"] }
sha2 = "0.11"
